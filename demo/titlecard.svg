<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Terminals, Intuition Labs. The answer, and the proof it holds.">
  <defs>
    <radialGradient id="halo" cx="50%" cy="30%" r="55%">
      <stop offset="0" stop-color="#9ecfd0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0f0f12" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0f0f12"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- the 7-grid mark -->
  <g fill="none" stroke="#8aa3bf" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <path d="M600 118 L516 262"/>
    <path d="M516 262 L684 262"/>
    <path d="M684 262 L600 118"/>
    <path d="M600 118 L600 262"/>
    <path d="M516 262 L642 190"/>
    <path d="M684 262 L558 190"/>
  </g>
  <circle cx="600" cy="214" r="48" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
  <g fill="#9ecfd0" stroke="#0f0f12" stroke-width="2.4" filter="url(#g)">
    <circle cx="600" cy="118" r="7"/>
    <circle cx="516" cy="262" r="7"/>
    <circle cx="684" cy="262" r="7"/>
    <circle cx="558" cy="190" r="7"/>
    <circle cx="600" cy="262" r="7"/>
    <circle cx="642" cy="190" r="7"/>
    <circle cx="600" cy="214" r="7"/>
  </g>

  <g font-family="Geist Mono, ui-monospace, SFMono-Regular, monospace" text-anchor="middle">
    <text x="600" y="408" font-size="76" font-weight="700" fill="#9ecfd0" letter-spacing="2">terminals</text>
    <line x1="500" y1="446" x2="700" y2="446" stroke="#6b7177" stroke-width="1"/>
    <text x="600" y="498" font-size="26" fill="#e7e3da">the answer, with its receipt</text>
    <text x="600" y="556" font-size="18" fill="#6b7177" letter-spacing="3">intuition labs · coherence over scale</text>
  </g>
</svg>
