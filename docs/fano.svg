<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="The 7-grid: seven ideas, seven trios, every pair of ideas on exactly one trio">
  <title>The 7-grid (Fano plane)</title>
  <desc>Seven points, seven lines (three sides, three medians, one circle). Every pair of points lies on exactly one line — nothing lost, nothing double-counted.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11203a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="408" height="408" rx="26" fill="url(#panel)"/>

  <!-- six straight lines: three sides + three medians (all crossing the centre) -->
  <g fill="none" stroke="#8aa3bf" stroke-width="3" stroke-linecap="round" opacity="0.92">
    <path d="M210 112 L70 355"/>
    <path d="M70 355 L350 355"/>
    <path d="M350 355 L210 112"/>
    <path d="M210 112 L210 355"/>
    <path d="M70 355 L280 234"/>
    <path d="M350 355 L140 234"/>
  </g>

  <!-- the seventh line is a circle, drawn in amber so the curved trio reads as a line too -->
  <circle cx="210" cy="274" r="81" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- seven points (Intuition Labs signature teal) -->
  <g fill="#9ecfd0" stroke="#0a1322" stroke-width="3" filter="url(#glow)">
    <circle cx="210" cy="112" r="16"/>
    <circle cx="70"  cy="355" r="16"/>
    <circle cx="350" cy="355" r="16"/>
    <circle cx="140" cy="234" r="16"/>
    <circle cx="210" cy="355" r="16"/>
    <circle cx="280" cy="234" r="16"/>
    <circle cx="210" cy="274" r="16"/>
  </g>
  <g fill="#05131f" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="210" y="112">1</text>
    <text x="70"  y="355">2</text>
    <text x="350" y="355">3</text>
    <text x="140" y="234">4</text>
    <text x="210" y="355">5</text>
    <text x="280" y="234">6</text>
    <text x="210" y="274">7</text>
  </g>
</svg>
