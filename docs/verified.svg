<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Terminals verification: tests and an independent security audit">
  <!-- SPDX-License-Identifier: CC-BY-4.0 -->
